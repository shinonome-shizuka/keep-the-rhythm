services:
  ktr:
    build: .
    restart: unless-stopped
    environment:
      KTR_TOKEN: ${KTR_TOKEN:?Set KTR_TOKEN in .env}
    ports:
      - "127.0.0.1:8787:8080"
    volumes:
      - ktr-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  ktr-data:
